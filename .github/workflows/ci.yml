name: Python CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Verify migration on SQLite
        env:
          DATABASE_URL: sqlite:///./ci_shopsense.db
        run: alembic upgrade head
      - name: Run tests
        run: pytest -q
      - name: Compile Python source
        run: python -m compileall -q app dashboard scripts
      - name: Ensure no accidental changes in schema
        run: git diff --exit-code
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f Dockerfile.api -t shopsense-api:ci .
      - name: Build dashboard image
        run: docker build -f Dockerfile.dashboard -t shopsense-dashboard:ci .
