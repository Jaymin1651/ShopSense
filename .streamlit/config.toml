# ShopSense dashboard theme. Colours carry meaning across every page:
# teal = healthy stock / primary action, amber = reorder, red = stock-out, violet = forecast.
[theme]
base = "light"
primaryColor = "#0E7C7B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F5F8"
textColor = "#1C2433"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
# Pages share one labelled menu (dashboard/ui.py: nav) instead of file-name labels.
showSidebarNavigation = false
